name: 發布婚禮請帖

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 讀取網站檔案
        uses: actions/checkout@v4
      - name: 檢查 JavaScript
        run: node --check script.js
      - name: 設定 Pages
        uses: actions/configure-pages@v5
      - name: 打包靜態網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v5
